<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebServer 控制台</title>
    <style>
        /* 基础样式重置 */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        /* 容器样式 */
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 320px;
        }

        h2 {
            margin-bottom: 2rem;
            font-weight: 500;
            letter-spacing: 1px;
        }

        /* 按钮美化 */
        form {
            margin-bottom: 1.2rem;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #fff;
            color: #764ba2;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
            background: #f0f0f0;
        }

        button:active {
            transform: translateY(0);
        }

        /* 最后一个按钮特殊颜色 */
        .btn-follow {
            background: #ff4757;
            color: white;
        }
        
        .btn-follow:hover {
            background: #ff6b81;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>请选择</h2>

        <form action="5" method="post">
            <button type="submit">查看照片 (xxx.jpg)</button>
        </form>

        <form action="6" method="post">
            <button type="submit">播放视频 (xxx.avi)</button>
        </form>

        <form action="7" method="post">
            <button type="submit" class="btn-follow">关注我</button>
        </form>
    </div>

</body>
</html>
