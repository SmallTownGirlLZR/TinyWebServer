<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>加入我们 - WebServer</title>
    <style>
        /* 保持全局色调统一 */
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #00c6fb 0%, #005bea 100%);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        /* 注册卡片 */
        .register-container {
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }

        h2 {
            margin-bottom: 1.5rem;
            color: #005bea;
            font-weight: 600;
        }

        /* 表单布局 */
        .form-group {
            margin-bottom: 1.2rem;
            text-align: left;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            margin-top: 5px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box; /* 确保padding不撑破布局 */
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus {
            border-color: #005bea;
            box-shadow: 0 0 8px rgba(0, 91, 234, 0.2);
        }

        /* 注册按钮 */
        button {
            width: 100%;
            padding: 13px;
            background: linear-gradient(to right, #00c6fb, #005bea);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s;
            margin-top: 1rem;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        /* 底部提示 */
        .footer-text {
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="register-container">
        <h2>创建账户</h2>
        <form action="3CGISQL.cgi" method="post">
            <div class="form-group">
                <input type="text" name="user" placeholder="请输入用户名" required>
            </div>
            <div class="form-group">
                <input type="password" name="password" placeholder="请输入密码" required>
            </div>
            <button type="submit">立即注册</button>
        </form>
        <div class="footer-text">
            注册即代表同意 WebServer 服务协议
        </div>
    </div>

</body>
</html>
