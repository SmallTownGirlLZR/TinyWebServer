<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢迎访问 - WebServer</title>
    <style>
        /* 采用极简主义深色背景 */
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: radial-gradient(circle at center, #2c3e50 0%, #000000 100%);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            overflow: hidden;
        }

        .welcome-box {
            text-align: center;
            animation: fadeIn 1.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 300;
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
        }

        p {
            color: #888;
            margin-bottom: 3rem;
            font-size: 1.1rem;
        }

        .btn-group {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        button {
            padding: 15px 40px;
            font-size: 1rem;
            font-weight: 500;
            border-radius: 50px; /* 圆角胶囊风格 */
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
            min-width: 160px;
        }

        /* “新用户” 按钮：亮色 */
        .btn-new {
            background: #fff;
            color: #000;
            border: none;
        }

        .btn-new:hover {
            background: #00d2ff;
            color: #fff;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.5);
        }

        /* “已有账号” 按钮：透明描边 */
        .btn-old {
            background: transparent;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn-old:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #fff;
        }

        /* 装饰用的小光点 */
        .glow {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 10px white;
            opacity: 0.3;
        }
    </style>
</head>
<body>

    <div class="welcome-box">
        <h1>Welcome</h1>
        <p>高性能 C++ Web Server 演示系统</p>

        <div class="btn-group">
            <form action="0" method="post">
                <button type="submit" class="btn-new">新用户注册</button>
            </form>

            <form action="1" method="post">
                <button type="submit" class="btn-old">已有账号登录</button>
            </form>
        </div>
    </div>

</body>
</html>
