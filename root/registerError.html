<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册失败 - WebServer</title>
    <style>
        /* 延续注册页的明亮蓝色渐变 */
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #00c6fb 0%, #005bea 100%);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .register-container {
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }

        /* 警告横幅：使用橙色，区别于登录错误的红色 */
        .warning-banner {
            background-color: #fffaf0;
            color: #dd6b20;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #fbd38d;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        h2 {
            margin-bottom: 1rem;
            color: #005bea;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 1.2rem;
            text-align: left;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            margin-top: 5px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            transition: all 0.3s;
            outline: none;
        }

        input:focus {
            border-color: #005bea;
            box-shadow: 0 0 8px rgba(0, 91, 234, 0.2);
        }

        button {
            width: 100%;
            padding: 13px;
            background: linear-gradient(to right, #00c6fb, #005bea);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.3s;
            margin-top: 1rem;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .footer-text {
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: #888;
        }

        .footer-text a {
            color: #005bea;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="register-container">
        <h2>注册账户</h2>

        <div class="warning-banner">
            <span>⚠️</span> 提示：该用户名已被注册，请换一个
        </div>

        <form action="3CGISQL.cgi" method="post">
            <div class="form-group">
                <input type="text" name="user" placeholder="尝试新用户名" required>
            </div>
            <div class="form-group">
                <input type="password" name="password" placeholder="设置密码" required>
            </div>
            <button type="submit">重新注册</button>
        </form>
        
        <div class="footer-text">
            已有账号？ <a href="log.html">直接登录</a>
        </div>
    </div>

</body>
</html>
