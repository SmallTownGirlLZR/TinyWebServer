<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关注作者 - WebServer</title>
    <style>
        /* 延续全局的高级感，使用深邃的紫黑渐变 */
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0f0c29;
            background: linear-gradient(to bottom, #24243e, #302b63, #0f0c29);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            overflow: hidden;
        }

        /* 个人卡片 */
        .profile-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            padding: 3rem;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 400px;
            width: 90%;
            transition: transform 0.3s ease;
        }

        .profile-card:hover {
            transform: translateY(-10px);
        }

        /* 头像占位符（会自动显示你的 GitHub 头像） */
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin-bottom: 1.5rem;
            border: 4px solid #00d2ff;
            padding: 5px;
            background: rgba(255, 255, 255, 0.1);
        }

        h2 {
            font-size: 1.8rem;
            margin: 10px 0;
            background: linear-gradient(to right, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #ccc;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        /* GitHub 关注按钮 */
        .github-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #fff;
            color: #333;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .github-btn:hover {
            background: #00d2ff;
            color: #fff;
            transform: scale(1.05);
            box-shadow: 0 15px 30px rgba(0, 210, 255, 0.4);
        }

        /* 返回链接 */
        .back-link {
            display: block;
            margin-top: 2rem;
            color: #666;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: #fff;
        }

        /* 简单的背景装饰气泡 */
        .circle {
            position: absolute;
            background: linear-gradient(to right, #00d2ff, #3a7bd5);
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.2;
        }
    </style>
</head>
<body>

    <div class="circle" style="width: 300px; height: 300px; top: -100px; right: -50px;"></div>
    <div class="circle" style="width: 200px; height: 200px; bottom: -50px; left: -50px;"></div>

    <div class="profile-card">
        <img src="https://github.com/SmallTownGirlLZR.png" alt="Avatar" class="avatar">
        
        <h2>SmallTownGirlLZR</h2>
        <p>感谢你运行我的 TinyWebServer 项目！<br>如果你觉得代码对你有帮助，欢迎来 GitHub 点个 Star。</p>

        <a href="https://github.com/SmallTownGirlLZR" target="_blank" class="github-btn">
            Follow on GitHub
        </a>

        <a href="javascript:history.back()" class="back-link">← 返回主页</a>
    </div>

</body>
</html>
