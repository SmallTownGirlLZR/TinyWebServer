<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片预览 - WebServer</title>
    <style>
        /* 统一页面基调 */
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: #0f0f0f; /* 深色背景更适合看图 */
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #eeeeee;
        }

        /* 文字标题美化 */
        .header-text {
            margin-bottom: 2rem;
            text-align: center;
        }

        h2 {
            font-weight: 300;
            letter-spacing: 1px;
        }

        h2 strong {
            color: #00d2ff;
            font-weight: 600;
        }

        /* 图片容器 */
        .image-container {
            position: relative;
            padding: 10px;
            background: #1e1e1e;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 85%;
            transition: transform 0.4s ease;
        }

        .image-container:hover {
            transform: scale(1.02); /* 悬停微扩效果 */
        }

        img {
            display: block;
            max-width: 100%;
            height: auto;
            border-radius: 6px;
        }

        /* 返回链接 */
        .back-btn {
            margin-top: 2.5rem;
            text-decoration: none;
            color: #888;
            font-size: 0.9rem;
            padding: 8px 20px;
            border: 1px solid #444;
            border-radius: 20px;
            transition: all 0.3s;
        }

        .back-btn:hover {
            color: #fff;
            background: #333;
            border-color: #666;
        }
    </style>
</head>
<body>

    <div class="header-text">
        <h2>你居然想看图，<strong>不想关注我？</strong> 📸</h2>
    </div>

    <div class="image-container">
        <img src="./xxx.jpg" title="预览图片" alt="图片加载中...">
    </div>

    <a href="javascript:history.back()" class="back-btn">返回控制台</a>

</body>
</html>
