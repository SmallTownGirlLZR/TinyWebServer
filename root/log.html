<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - WebServer</title>
    <style>
        /* 保持全局色调统一，使用更稳重的深蓝渐变 */
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        /* 登录卡片 */
        .login-container {
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }

        h2 {
            margin-bottom: 1.5rem;
            color: #1e3c72;
            font-weight: 600;
        }

        /* 表单布局 */
        .form-group {
            margin-bottom: 1.2rem;
            text-align: left;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            margin-top: 5px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus {
            border-color: #1e3c72;
            box-shadow: 0 0 8px rgba(30, 60, 114, 0.2);
        }

        /* 登录按钮 */
        button {
            width: 100%;
            padding: 13px;
            background: linear-gradient(to right, #1e3c72, #2a5298);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 1rem;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        /* 底部链接 */
        .footer-links {
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: #666;
        }

        .footer-links a {
            color: #1e3c72;
            text-decoration: none;
            font-weight: 600;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>欢迎回来</h2>
        <form action="2CGISQL.cgi" method="post">
            <div class="form-group">
                <input type="text" name="user" placeholder="用户名" required>
            </div>
            <div class="form-group">
                <input type="password" name="password" placeholder="密码" required>
            </div>
            <button type="submit">立即登录</button>
        </form>
        
        <div class="footer-links">
            还没有账号？ <a href="register.html">立即注册</a>
        </div>
    </div>

</body>
</html>
